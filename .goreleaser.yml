version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: kojuto
    main: .
    binary: kojuto
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    # certificate MUST be declared: GoReleaser only exports the
    # ${certificate} template variable when this field is set. Without it
    # the variable expanded to the empty string, cosign was invoked with
    # `--output-certificate=` and failed on the empty path — so every
    # tagged release built, archived, and checksummed, then died at the
    # signing step and never produced a GitHub Release. ${signature} was
    # unaffected because it defaults to ${artifact}.sig.
    #
    # The .pem / .sig pair is what CONTRIBUTING.md's `cosign verify-blob`
    # instructions already tell users to fetch, so this restores the
    # documented behaviour rather than switching to the newer bundle form.
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: RalianENG
    name: kojuto
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
