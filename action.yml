name: 'Kojuto Supply Chain Scanner'
description: 'Detect suspicious syscall activity during package installation'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  package:
    description: 'Package name to scan (mutually exclusive with file and local)'
    required: false
    default: ''
  version:
    description: 'Package version (default: latest)'
    required: false
    default: ''
  ecosystem:
    description: 'Ecosystem: pypi or npm (default: pypi)'
    required: false
    default: 'pypi'
  file:
    description: 'Dependency file to scan (requirements.txt or package.json)'
    required: false
    default: ''
  pin:
    description: 'Output pinned dependency file after all-clean scan (requires file)'
    required: false
    default: ''
  local:
    description: 'Scan a local package file (.whl, .tgz) or directory'
    required: false
    default: ''
  config:
    description: 'Path to kojuto.yml config file (default: kojuto.yml in current directory)'
    required: false
    default: ''
  runtime:
    description: 'Container runtime: auto (use gVisor if available), runsc (force gVisor), runc (force Docker default)'
    required: false
    default: 'auto'
  probe-method:
    description: 'Probe method: auto, ebpf, strace, strace-container'
    required: false
    default: 'auto'
  timeout:
    description: 'Scan timeout per package (e.g. 5m, 10m)'
    required: false
    default: '5m'
  strict:
    description: 'Ignore sensitive_paths.exclude from config (recommended for CI)'
    required: false
    default: 'true'
  quiet:
    description: 'Suppress phase progress output; emit only the final verdict block'
    required: false
    default: 'false'
  no-color:
    description: 'Disable colored output (NO_COLOR env is also respected)'
    required: false
    default: 'false'

outputs:
  # A composite action only exposes an output if it carries an explicit
  # `value:`. Without these two lines the outputs were declared but always
  # resolved to the empty string, so a caller gating on
  # `steps.kojuto.outputs.verdict == 'suspicious'` — the documented usage,
  # and the natural one when the step runs under continue-on-error — never
  # fired and a suspicious package passed the gate.
  verdict:
    description: 'Scan verdict: clean, suspicious, inconclusive, or error if the scan did not produce a report'
    value: ${{ steps.scan.outputs.verdict }}
  report:
    description: 'Path to JSON report'
    value: ${{ steps.scan.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: Build kojuto
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        make build

    - name: Build sandbox image
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        docker build -f Dockerfile.sandbox -t kojuto-sandbox:latest .

    - name: Run scan
      shell: bash
      id: scan
      env:
        KOJUTO_PACKAGE: ${{ inputs.package }}
        KOJUTO_VERSION: ${{ inputs.version }}
        KOJUTO_ECOSYSTEM: ${{ inputs.ecosystem }}
        KOJUTO_FILE: ${{ inputs.file }}
        KOJUTO_PIN: ${{ inputs.pin }}
        KOJUTO_LOCAL: ${{ inputs.local }}
        KOJUTO_CONFIG: ${{ inputs.config }}
        KOJUTO_RUNTIME: ${{ inputs.runtime }}
        KOJUTO_PROBE_METHOD: ${{ inputs.probe-method }}
        KOJUTO_TIMEOUT: ${{ inputs.timeout }}
        KOJUTO_STRICT: ${{ inputs.strict }}
        KOJUTO_QUIET: ${{ inputs.quiet }}
        KOJUTO_NO_COLOR: ${{ inputs['no-color'] }}
      run: |
        ARGS=()

        # Determine scan mode: single package, file, or local.
        if [ -n "$KOJUTO_FILE" ]; then
          ARGS+=("-f" "$KOJUTO_FILE")
          ARGS+=("-e" "$KOJUTO_ECOSYSTEM")
          if [ -n "$KOJUTO_PIN" ]; then
            ARGS+=("--pin" "$KOJUTO_PIN")
          fi
        elif [ -n "$KOJUTO_LOCAL" ]; then
          ARGS+=("--local" "$KOJUTO_LOCAL")
        else
          if [ -z "$KOJUTO_PACKAGE" ]; then
            echo "::error::Either 'package', 'file', or 'local' input is required"
            exit 1
          fi
          ARGS+=("$KOJUTO_PACKAGE")
          ARGS+=("-e" "$KOJUTO_ECOSYSTEM")
          if [ -n "$KOJUTO_VERSION" ]; then
            ARGS+=("--version" "$KOJUTO_VERSION")
          fi
        fi

        # Common flags.
        ARGS+=("--probe-method" "$KOJUTO_PROBE_METHOD")
        ARGS+=("--timeout" "$KOJUTO_TIMEOUT")
        if [ -n "$KOJUTO_RUNTIME" ]; then
          ARGS+=("--runtime" "$KOJUTO_RUNTIME")
        fi
        if [ -n "$KOJUTO_CONFIG" ]; then
          ARGS+=("--config" "$KOJUTO_CONFIG")
        fi
        if [ "$KOJUTO_STRICT" = "true" ]; then
          ARGS+=("--strict")
        fi
        if [ "$KOJUTO_QUIET" = "true" ]; then
          ARGS+=("--quiet")
        fi
        if [ "$KOJUTO_NO_COLOR" = "true" ]; then
          ARGS+=("--no-color")
        fi

        REPORT=/tmp/kojuto-report.json

        # kojuto exits 2 on a suspicious or inconclusive verdict. Capture the
        # status instead of letting the shell abort here, so the outputs are
        # always published before the step fails — previously the exit
        # propagated immediately and the two lines below never ran, leaving
        # the outputs empty on exactly the runs a caller most needs them.
        set +e
        sudo "${{ github.action_path }}/kojuto" scan "${ARGS[@]}" -o "$REPORT"
        STATUS=$?
        set -e

        # kojuto writes the report 0600, and it ran as root under sudo, so
        # the runner user cannot read it back without this.
        if [ -f "$REPORT" ]; then
          sudo chown "$(id -u):$(id -g)" "$REPORT"
        fi

        echo "report=$REPORT" >> "$GITHUB_OUTPUT"

        VERDICT=""
        if [ -f "$REPORT" ]; then
          VERDICT=$(jq -r '.verdict // empty' "$REPORT")
        fi
        if [ -z "$VERDICT" ]; then
          # The scan died before producing a report (Docker unavailable,
          # download failure, timeout). Emit an explicit sentinel rather than
          # an empty string: a caller comparing against 'clean' must not read
          # "we never scanned" as "nothing was found".
          VERDICT="error"
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

        exit $STATUS
