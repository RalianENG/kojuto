version: "2"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - intrange
    - ireturn
    - maintidx
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    # tagliatelle disabled: npm's devDependencies uses camelCase by spec
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 20
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - os.RemoveAll
        - (io.Closer).Close
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    funlen:
      lines: 100
      statements: 60
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
    gocyclo:
      min-complexity: 20
    gosec:
      # The severity gate, not the rule list, was doing the filtering here:
      # at `severity: high` every Medium rule is dropped before exclusions are
      # consulted, which left most of the old blanket exclude list as dead
      # configuration. Running at Medium turns the file-permission rules back
      # on — the class that matters most for a tool whose staging directories
      # are bind-mounted into containers, where a stray world-writable mode
      # lets any local account inject a package into a scan in progress.
      # The Medium findings that remain are deliberate and are excluded
      # per-path under `exclusions.rules`, with the reason recorded there.
      excludes:
        # G204 (subprocess launched with variable) is inherent: kojuto exists
        # to run docker/pip/npm with arguments derived from user input. Every
        # such site builds an argv slice — no shell is involved — and package
        # names are validated at the boundary by downloader.ValidatePackage.
        - G204
        # G304 (file inclusion via variable): reading the path the user named
        # on the command line (--config, --local, -f) is the feature.
        - G304
        # G115 (integer conversion overflow): PID and port conversions between
        # the kernel ABI uint32/uint16 and Go ints.
        - G115
        # G104 (unhandled errors): errcheck covers this with better
        # configuration, including the deliberate-discard exemptions.
        - G104
      severity: medium
      confidence: medium
    govet:
      enable-all: true
      disable:
        - fieldalignment
    maintidx:
      under: 20
    misspell:
      locale: US
    nakedret:
      max-func-lines: 10
    nestif:
      min-complexity: 8
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    tagliatelle:
      case:
        rules:
          json: snake
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - errcheck
          - funlen
          - gocognit
          - gocritic
          - wrapcheck
        path: _test\.go
      - linters:
          - gosec
        # Test fixtures write throwaway files with conventional modes.
        path: _test\.go
      - linters:
          - gosec
        # G301/G306: these specific writes MUST be readable, and the staging
        # directory traversable, by the sandbox container’s dev user, which runs
        # as UID 1000 and is not the host UID — the seccomp profile, the
        # /.dockerenv mask, the staging package.json, and the copied tarball.
        # Each site carries a comment explaining the mode it picks. Scoped to
        # these files rather than excluded globally, so an unintended
        # world-readable or world-writable write in any NEW location still
        # fails the build.
        text: "G30(1|6)"
        path: (cmd/root\.go|internal/downloader/downloader\.go|internal/sandbox/sandbox(_download)?\.go)
      - linters:
          - errcheck
          - unused
        path: probe_stub\.go
      - linters:
          - ireturn
          - revive
        path: probe_other\.go
      - linters:
          - errcheck
        path: sandbox\.go
        text: "cmd.Run|rand.Read"
      - linters:
          - wrapcheck
        path: root\.go
      - linters:
          - staticcheck
        # SA5011 fires on `if x == nil { t.Fatal(...) }; use(x)` patterns
        # in tests. `t.Fatal` calls runtime.Goexit so the deref never
        # runs, but older staticcheck versions don't model that.
        text: "SA6000|SA4000|SA5011|QF1002"
      - linters:
          - revive
        # `package types` is the shared types package under test.
        # revive's var-naming rule flags it as "meaningless" on test
        # files; renaming would ripple across every importer.
        path: internal/types/
        text: "avoid meaningless package names"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
